name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show the compile errors (only when the build fails)
        if: failure()
        run: |
          echo "=============== COMPILE ERRORS ==============="
          grep -E "^e: |error:|Unresolved reference|Type mismatch" build.log | head -60 || true
          echo "=============== END ==============="
          {
            echo '### Compile errors'
            echo '```'
            grep -E "^e: |error:|Unresolved reference|Type mismatch" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tests and lint run after the APK is saved, so a test/lint failure
      # does not block getting the APK. Check the logs/reports if these fail.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
