name: Build from zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo holds the project as a .zip file. Unzip the most recently
      # uploaded .zip, then find the Android project folder inside it.
      - name: Unzip the project and find the Android folder
        run: |
          set -e
          ZIP=""
          BEST=0
          for f in ./*.zip; do
            [ -e "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            T=${T:-0}
            if [ -z "$ZIP" ] || [ "$T" -gt "$BEST" ]; then ZIP="$f"; BEST="$T"; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: no .zip file found in the repo. Files here:"
            ls -la
            exit 1
          fi
          echo "Using zip: $ZIP"
          rm -rf android_src
          unzip -q -o "$ZIP" -d android_src
          SETTINGS=$(find android_src -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found inside the zip. Zip contents (first 100):"
            find android_src -maxdepth 3 | head -100
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Android project folder: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
            echo "Found gradlew, using it."
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
            echo "gradlew missing in the zip, using Gradle 8.9 installed by the workflow."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -o pipefail
          if [ "$USE_WRAPPER" = "true" ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show the compile errors (only when the build fails)
        if: failure()
        working-directory: ${{ env.ROOT }}
        run: |
          echo "=============== COMPILE ERRORS ==============="
          grep -E "^e: |error:|Unresolved reference|Type mismatch" build.log | head -60 || true
          echo "=============== END ==============="
          {
            echo '### Compile errors'
            echo '```'
            grep -E "^e: |error:|Unresolved reference|Type mismatch" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.ROOT }}/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
